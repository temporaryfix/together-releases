<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Together</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../screen.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 44 28"><circle xmlns="http://www.w3.org/2000/svg" cx="15" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2.5" /><circle xmlns="http://www.w3.org/2000/svg" cx="29" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2.5" /><path xmlns="http://www.w3.org/2000/svg" d="M22.0 6.858572 A10 10 0 0 1 22.0 21.141428 A10 10 0 0 1 22.0 6.858572Z" fill="currentColor" /></symbol></defs></svg>
  <main class="screen landing camera-landing" aria-labelledby="pairing-title">
    <div class="masthead" aria-hidden="true"></div>
    <div class="middle">
      <h1 id="pairing-title" class="headline brand-lockup is-compact" data-l10n-aria-label="ui-watch-together-wherever-you-are">
        <span class="brand-row" aria-hidden="true"><svg viewBox="3.75 2.75 36.5 22.5" aria-hidden="true"><use href="#mark" width="44" height="28"/></svg><span data-l10n-id="ui-watch-together-wherever-you-are"></span></span>
        <span class="brand-compact" aria-hidden="true"><svg viewBox="3.75 2.75 36.5 22.5" aria-hidden="true"><use href="#mark" width="44" height="28"/></svg><span data-l10n-id="brand-tagline-together"></span><span data-l10n-id="brand-tagline-wherever"></span></span>
      </h1>
      <p class="hint" data-pairing-help hidden data-l10n-id="screen-camera-open"></p>
      <p class="field-error" role="alert" data-pairing-error></p>
      <a class="btn btn-primary btn-large" data-open-app hidden data-l10n-id="screen-open-app"></a>
      <a class="btn btn-secondary" data-download hidden rel="noreferrer" data-l10n-id="screen-download-app"></a>
      <p class="hint" data-distribution data-l10n-id="screen-download-unavailable"></p>
      <p class="hint" data-after-install hidden data-l10n-id="screen-after-install"></p>
      <noscript><p>Enable JavaScript to open this TV in Together.</p></noscript>
    </div>
  </main>
</body>
</html>
