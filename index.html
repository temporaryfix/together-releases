<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Watch together, wherever you are. Peer to peer, no accounts, nothing to install.">
  <title>Together</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="backend.js">
  <link rel="modulepreload" href="pkg/together_web.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Icons, drawn once and referenced with <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-leave" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 5.5A2 2 0 0 0 14 4H6a2 2 0 0 0-2 2v8a2 2 0 0 0 1.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10 9.2 5 2.8-5 2.8z" fill="currentColor"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10v4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <!-- You, solid, and a friend in outline. -->
      <symbol id="mark" viewBox="0 0 44 28">
        <circle cx="15" cy="14" r="11" fill="currentColor"/>
        <circle cx="29" cy="14" r="10.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
    </defs>
  </svg>

  <!-- Landing -->
  <main id="landing" class="screen landing">
    <header class="masthead">
      <span class="wordmark"><svg class="wordmark-mark" aria-hidden="true"><use href="#mark"/></svg><span data-l10n-id="ui-together"></span></span>
    </header>

    <div class="middle">
      <h1 class="headline"><span data-l10n-id="ui-watch-together-wherever-you-are"></span></h1>

      <section class="stage-card dropzone" data-dropzone data-l10n-aria-label="ui-start-a-room">
        <div class="name-slot" data-name-slot></div>
        <label class="btn btn-primary btn-large">
          <input class="visually-hidden" type="file" accept="video/*,.mkv,.mov" data-file>
          <span data-l10n-id="ui-start-a-room"></span>
        </label>
        <p class="hint"><span data-l10n-id="ui-choose-a-video-or-drop-one-anywhere"></span></p>
        <p class="field-error" role="alert" data-error></p>
      </section>

      <form class="join-form" data-join-form novalidate>
        <label class="visually-hidden" for="invite-input"><span data-l10n-id="ui-invite-link"></span></label>
        <input id="invite-input" class="input" type="text" data-l10n-placeholder="ui-have-an-invite-link-paste-it-here" autocomplete="off" autocapitalize="off" spellcheck="false" data-invite-input>
        <button class="btn btn-secondary" type="submit"><span data-l10n-id="ui-join"></span></button>
      </form>
      <p class="field-error" role="alert" data-join-error></p>
      <div class="tune-offer">
        <together-tune>
        <p class="tune-row hint" aria-live="polite">
          <span data-tune-status><span data-l10n-id="ui-sound-early-or-late"></span></span>
          <button class="quiet-link" type="button" data-tune><span data-l10n-id="ui-tune-it"></span></button>
        </p>
        <p class="hint tune-how" data-tune-how><span data-l10n-id="tune-instructions"></span></p>
        </together-tune>
      </div>
      <!-- While tuning runs: the same meter and phases as the extension's Tune page. -->
      <section class="tune-run" data-tune-run hidden>
        <p class="tune-step" role="status" data-tune-step></p>
        <div class="tune-meter" data-tune-meter>
          <span class="visually-hidden" data-tune-meter-text><span data-l10n-id="ui-microphone-level"></span></span>
        </div>
        <ol class="tune-phases">
          <li class="tune-phase" data-tune-phase="microphone"><span class="tune-phase-bar"></span><span data-l10n-id="ui-microphone"></span></li>
          <li class="tune-phase" data-tune-phase="reference"><span class="tune-phase-bar"></span><span data-l10n-id="ui-this-computer"></span></li>
          <li class="tune-phase" data-tune-phase="video"><span class="tune-phase-bar"></span><span data-l10n-id="ui-the-video"></span></li>
        </ol>
        <p class="hint tune-hot" data-tune-hot hidden><span data-l10n-id="tune-microphone-loud"></span></p>
      </section>
      <video class="visually-hidden" playsinline data-tune-video></video>
    </div>
  </main>

  <!-- Opened from an invite link -->
  <main id="invited" class="screen invited" hidden>
    <header class="masthead">
      <a class="wordmark" href="./" data-home><svg class="wordmark-mark" aria-hidden="true"><use href="#mark"/></svg><span data-l10n-id="ui-together"></span></a>
    </header>

    <div class="middle">
      <h1 class="headline"><span data-l10n-id="ui-you-re-invited-to-watch-together"></span></h1>

      <section class="stage-card dropzone" data-dropzone data-l10n-aria-label="ui-join-the-room">
        <div class="name-slot" data-name-slot></div>
        <!-- Streaming needs a relay of your own in a browser, so usually it's your own copy. -->
        <button class="btn btn-primary btn-large" type="button" data-stream hidden><span data-l10n-id="ui-join"></span></button>
        <label class="btn btn-large" data-own-copy>
          <input class="visually-hidden" type="file" accept="video/*,.mkv,.mov" data-file>
          <span data-l10n-id="ui-join-with-your-copy"></span>
        </label>
        <p class="hint" data-own-copy-hint><span data-l10n-id="invite-own-copy"></span></p>
        <p class="field-error" role="alert" data-error></p>
      </section>

      <!-- A room on a site's own player (YouTube, Netflix…), started by the extension: it can only
           be joined there, through the extension. -->
      <section class="stage-card on-site" data-on-site data-l10n-aria-label="ui-join-on-the-site" hidden>
        <p class="on-site-where" data-on-site-where></p>
        <p class="hint" data-on-site-how><span data-l10n-id="invite-extension-instructions"></span></p>
        <a class="btn btn-primary btn-large" href="https://github.com/temporaryfix/together-releases#install" target="_blank" rel="noopener" data-on-site-install><span data-l10n-id="ui-install-the-extension"></span></a>
        <a class="quiet-link" target="_blank" rel="noopener" data-on-site-page><span data-l10n-id="ui-open-the-video"></span></a>
      </section>
    </div>
  </main>

  <!-- The room -->
  <main id="room" class="screen room" hidden>
    <div class="stage" data-stage>
      <video class="video" playsinline preload="auto" data-video></video>

      <header class="topbar chrome">
        <div class="room-title">
          <svg class="room-mark" aria-hidden="true"><use href="#mark"/></svg>
          <span class="room-name" data-title></span>
        </div>
        <together-people><ul class="people" data-l10n-aria-label="ui-people-in-the-room" data-people></ul></together-people>
        <div class="topbar-actions">
          <!-- For power users: each person's real gap from the room in ms, and this output's tune. -->
          <button class="btn btn-icon timings-toggle" type="button" aria-pressed="false" data-l10n-aria-label="ui-show-timings" data-l10n-title="ui-show-timings" data-timings><span data-l10n-id="ui-ms"></span></button>
          <button class="btn btn-primary" type="button" data-invite popovertarget="invite-popover">
            <svg class="icon" aria-hidden="true"><use href="#i-link"/></svg><span data-l10n-id="ui-invite"></span>
          </button>
          <button class="btn btn-icon" type="button" data-l10n-aria-label="ui-leave" data-l10n-title="ui-leave" data-leave>
            <svg class="icon" aria-hidden="true"><use href="#i-leave"/></svg>
          </button>
        </div>
      </header>

      <div class="notice" role="status" data-mismatch hidden>
        <svg class="icon notice-icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <div class="notice-body">
          <p class="notice-title" data-mismatch-title></p>
          <p class="notice-text" data-mismatch-text></p>
        </div>
        <button class="btn btn-icon btn-small" type="button" data-l10n-aria-label="ui-dismiss" data-mismatch-close>
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <together-toasts><ol class="toasts" aria-live="polite" data-toasts></ol></together-toasts>

      <div class="overlay" data-overlay hidden></div>

      <!-- The ready check: what to do next once friends are here. -->
      <div class="ready-prompt" data-ready-control hidden>
        <p class="ready-title" data-ready-title></p>
        <p class="ready-note" data-ready-note></p>
        <together-ready large keyboard></together-ready>
      </div>

      <div class="controls chrome" data-controls>
        <input class="scrubber" type="range" min="0" max="0" step="0.01" value="0" data-l10n-aria-label="ui-seek" data-scrubber>
        <div class="controls-row">
          <button class="btn btn-icon btn-play" type="button" data-l10n-aria-label="ui-play" data-l10n-title="ui-play-space" data-play>
            <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
          </button>
          <p class="time"><span data-current>0:00</span><span class="time-sep"> / </span><span data-duration>0:00</span></p>
          <span class="spacer"></span>
          <div class="volume">
            <button class="btn btn-icon" type="button" data-l10n-aria-label="ui-mute" data-l10n-title="ui-mute-m" data-mute>
              <svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg>
            </button>
            <input class="volume-slider" type="range" min="0" max="1" step="0.05" value="1" data-l10n-aria-label="ui-volume" data-volume>
          </div>
          <button class="btn btn-icon" type="button" data-l10n-aria-label="ui-full-screen" data-l10n-title="ui-full-screen-f" data-fullscreen>
            <svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="popover" id="invite-popover" popover data-invite-popover>
      <h2 class="popover-title"><span data-l10n-id="ui-invite-friends"></span></h2>
      <together-invite qr-pixels="208">
      <!-- The one invite every surface hands out: a link, and a QR code of the same link. -->
      <div class="invite-qr" role="img" data-l10n-aria-label="ui-qr-code-of-the-invite-link" data-invite-qr></div>
      <div class="copy-row">
        <label class="visually-hidden" for="invite-link"><span data-l10n-id="ui-invite-link"></span></label>
        <input id="invite-link" class="input input-mono" type="text" readonly data-invite-link>
        <button class="btn btn-secondary" type="button" data-copy-link>
          <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-l10n-id="ui-copy-link"></span>
        </button>
      </div>
      </together-invite>
      <p class="popover-text"><span data-l10n-id="ui-anyone-with-the-link-can-join"></span></p>
      <p class="popover-text popover-faint"><span data-l10n-id="ui-in-a-terminal"></span> <code>together &lt;link&gt;</code></p>
    </div>
  </main>

  <!-- Files dragged over the window: the whole window takes them. A pointer-only affordance; the
       buttons that open a file do the same for everyone else. -->
  <div class="drop" data-drop aria-hidden="true">
    <div class="drop-body">
      <svg class="drop-mark" viewBox="0 0 64 28">
        <circle class="drop-you" cx="25" cy="14" r="11"/>
        <circle class="drop-friend" cx="39" cy="14" r="10.25"/>
      </svg>
      <p class="drop-title" data-drop-title></p>
    </div>
  </div>

  <noscript><p class="noscript">Together needs JavaScript and WebAssembly to run.</p></noscript>
</body>
</html>
